<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Simple Map Page Embed</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      :root {
        color-scheme: light;
        --bg: #dcefe8;
        --panel: rgba(250, 252, 249, 0.96);
        --panel-strong: rgba(246, 250, 247, 0.98);
        --text: #14302a;
        --muted: #55736b;
        --accent: #0b8f87;
        --accent-dark: #08645e;
        --border: rgba(20, 48, 42, 0.12);
        --shadow: 0 18px 48px rgba(14, 43, 36, 0.18);
        --safe-bottom: max(env(safe-area-inset-bottom), 16px);
        font-family: "Segoe UI", "Aptos", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.75), transparent 34%),
          linear-gradient(160deg, #eef7f3 0%, #d8ece4 52%, #c3dfd7 100%);
        color: var(--text);
      }

      body {
        overscroll-behavior: none;
      }

      .app-shell {
        position: relative;
        min-height: 100vh;
      }

      #map {
        height: 100vh;
        width: 100%;
      }

      .status-card {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 600;
        width: min(280px, calc(100vw - 32px));
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .status-label,
      .eyebrow {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #location-status,
      .drawer h1,
      .drawer h2,
      .drawer p {
        margin: 0;
      }

      .drawer-toggle {
        position: fixed;
        right: 18px;
        bottom: var(--safe-bottom);
        z-index: 900;
        display: grid;
        gap: 5px;
        width: 62px;
        height: 62px;
        padding: 17px 14px;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(180deg, #10483f 0%, #0b8f87 100%);
        box-shadow: 0 14px 32px rgba(11, 88, 78, 0.36);
      }

      .drawer-toggle span {
        display: block;
        height: 3px;
        border-radius: 999px;
        background: #f6f7f2;
      }

      .drawer {
        position: fixed;
        right: 12px;
        bottom: calc(var(--safe-bottom) + 78px);
        z-index: 850;
        width: min(420px, calc(100vw - 24px));
        max-height: min(72vh, 760px);
        display: grid;
        grid-template-rows: auto 1fr;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel-strong);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        transform: translateY(18px);
        opacity: 0;
        pointer-events: none;
        transition: transform 180ms ease, opacity 180ms ease;
      }

      .drawer.is-open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .drawer-header,
      .drawer-body,
      .panel-section,
      .editor-form {
        display: grid;
        gap: 14px;
      }

      .drawer-header {
        grid-template-columns: 1fr auto;
        align-items: start;
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--border);
      }

      .drawer-body {
        overflow: auto;
        padding: 14px 18px 18px;
      }

      .text-button,
      .primary-button,
      .object-list button {
        font: inherit;
      }

      .text-button {
        border: 0;
        background: transparent;
        color: var(--accent-dark);
        font-weight: 700;
      }

      .object-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .object-list button {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        text-align: left;
      }

      .object-list button.is-selected {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, white);
      }

      .list-meta {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .editor-header {
        display: grid;
        gap: 4px;
      }

      .editor-form label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      .editor-form input[type="text"],
      .editor-form input[type="color"],
      .editor-form textarea {
        width: 100%;
        border: 1px solid rgba(20, 48, 42, 0.18);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.88);
        padding: 12px 14px;
        color: var(--text);
      }

      .editor-form input[type="color"] {
        min-height: 48px;
        padding: 6px;
      }

      .checkbox-row {
        grid-template-columns: auto 1fr;
        align-items: center;
      }

      .checkbox-row input {
        width: 18px;
        height: 18px;
      }

      .primary-button {
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #0d7c74 0%, #09534d 100%);
        color: #fbfff8;
        padding: 12px 18px;
        font-weight: 700;
      }

      .editor-actions {
        display: grid;
        gap: 8px;
      }

      .save-status {
        min-height: 1.2em;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .popup-details {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .popup-details li {
        margin-bottom: 4px;
      }

      @media (max-width: 720px) {
        .status-card {
          top: 12px;
          left: 12px;
          width: min(260px, calc(100vw - 24px));
        }

        .drawer {
          right: 0;
          left: 0;
          bottom: 0;
          width: 100%;
          max-height: 78vh;
          border-radius: 24px 24px 0 0;
        }

        .drawer-toggle {
          right: 14px;
        }
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: rgba(250, 252, 249, 0.96);
        color: var(--text);
      }
    </style>
  </head>

  <body>
    <main class="app-shell">
      <div id="map" aria-label="Interactive map"></div>

      <section class="status-card" aria-live="polite">
        <p class="status-label">Location</p>
        <p id="location-status">Requesting GPS access...</p>
      </section>

      <button
        id="drawer-toggle"
        class="drawer-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="drawer"
        aria-label="Open object list"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <aside id="drawer" class="drawer" aria-label="GeoJSON objects">
        <div class="drawer-header">
          <div>
            <p class="eyebrow">Objects</p>
            <h1>GeoJSON Layers</h1>
          </div>
          <button id="drawer-close" class="text-button" type="button">Close</button>
        </div>

        <div class="drawer-body">
          <section class="panel-section">
            <h2>All objects</h2>
            <ul id="object-list" class="object-list"></ul>
          </section>

          <section class="panel-section">
            <div class="editor-header">
              <h2>Edit object</h2>
              <p id="editor-empty-state">Select an object from the list.</p>
            </div>

            <form id="editor-form" class="editor-form" hidden>
              <label>
                Title
                <input id="field-name" name="name" type="text" placeholder="Object label" />
              </label>

              <label>
                Color
                <input id="field-color" name="color" type="color" value="#0b8f87" />
              </label>

              <label class="checkbox-row">
                <input id="field-visible" name="visible" type="checkbox" />
                Visible on map
              </label>

              <label>
                Description
                <textarea
                  id="field-description"
                  name="description"
                  rows="3"
                  placeholder="Extra details shown when tapped"
                ></textarea>
              </label>

              <label>
                Additional data (JSON)
                <textarea
                  id="field-extra"
                  name="extra"
                  rows="5"
                  spellcheck="false"
                  placeholder='{"priority":"high"}'
                ></textarea>
              </label>

              <div class="editor-actions">
                <button class="primary-button" type="submit">Save changes</button>
                <p id="save-status" class="save-status" aria-live="polite"></p>
              </div>
            </form>
          </section>
        </div>
      </aside>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script type="module">
      import {
        initializeApp,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getDatabase,
        onValue,
        ref,
        update,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

      const firebaseConfig = {
        apiKey: "",
        authDomain: "",
        databaseURL: "",
        projectId: "",
        storageBucket: "",
        messagingSenderId: "",
        appId: "",
      };

      const firebaseCollectionPath = "geoObjects";

      const demoGeoObjects = {
        downtown: {
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [-122.4194, 37.7749],
          },
          properties: {
            id: "downtown",
            name: "Downtown Pin",
            visible: true,
            color: "#0b8f87",
            description: "Current point of interest.",
            extraData: {
              category: "pin",
              priority: "high",
            },
          },
        },
        stagingZone: {
          type: "Feature",
          geometry: {
            type: "Polygon",
            coordinates: [[
              [-122.425, 37.779],
              [-122.413, 37.779],
              [-122.413, 37.771],
              [-122.425, 37.771],
              [-122.425, 37.779],
            ]],
          },
          properties: {
            id: "stagingZone",
            name: "Staging Zone",
            visible: true,
            color: "#d2603f",
            description: "Rectangular work area.",
            extraData: {
              access: "restricted",
              supervisor: "Ops A",
            },
          },
        },
        hiddenMarker: {
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [-122.4094, 37.7812],
          },
          properties: {
            id: "hiddenMarker",
            name: "Hidden Marker",
            visible: false,
            color: "#5e718c",
            description: "This stays hidden until visibility is enabled.",
            extraData: {
              category: "standby",
            },
          },
        },
      };

      const state = {
        map: null,
        userMarker: null,
        geoJsonLayer: null,
        database: null,
        firebaseReady: false,
        objects: {},
        selectedId: null,
        userLocation: null,
      };

      const locationStatus = document.querySelector("#location-status");
      const drawer = document.querySelector("#drawer");
      const drawerToggle = document.querySelector("#drawer-toggle");
      const drawerClose = document.querySelector("#drawer-close");
      const objectList = document.querySelector("#object-list");
      const editorForm = document.querySelector("#editor-form");
      const editorEmptyState = document.querySelector("#editor-empty-state");
      const saveStatus = document.querySelector("#save-status");
      const fieldName = document.querySelector("#field-name");
      const fieldColor = document.querySelector("#field-color");
      const fieldVisible = document.querySelector("#field-visible");
      const fieldDescription = document.querySelector("#field-description");
      const fieldExtra = document.querySelector("#field-extra");

      init();

      function init() {
        initMap();
        bindUi();
        locateUser();
        initFirebaseListener();
      }

      function initMap() {
        state.map = L.map("map", {
          zoomControl: false,
          tap: true,
        }).setView([37.7749, -122.4194], 14);

        L.control.zoom({ position: "topright" }).addTo(state.map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 20,
        }).addTo(state.map);
      }

      function bindUi() {
        drawerToggle.addEventListener("click", () => setDrawerOpen(!drawer.classList.contains("is-open")));
        drawerClose.addEventListener("click", () => setDrawerOpen(false));

        objectList.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-id]");
          if (!button) {
            return;
          }

          selectObject(button.dataset.id, { flyTo: true });
        });

        editorForm.addEventListener("submit", async (event) => {
          event.preventDefault();

          if (!state.selectedId) {
            return;
          }

          const objectEntry = state.objects[state.selectedId];
          if (!objectEntry) {
            return;
          }

          let parsedExtra = {};

          try {
            parsedExtra = fieldExtra.value.trim() ? JSON.parse(fieldExtra.value) : {};
          } catch {
            saveStatus.textContent = "Additional data must be valid JSON.";
            return;
          }

          const nextEntry = {
            ...objectEntry,
            properties: {
              ...objectEntry.properties,
              name: fieldName.value.trim() || objectEntry.properties.name || state.selectedId,
              color: fieldColor.value,
              visible: fieldVisible.checked,
              description: fieldDescription.value.trim(),
              extraData: parsedExtra,
            },
          };

          saveStatus.textContent = state.firebaseReady ? "Saving to Firebase..." : "Saving locally...";

          try {
            await persistObject(state.selectedId, nextEntry);
            saveStatus.textContent = state.firebaseReady
              ? "Saved. Remote updates will sync automatically."
              : "Saved locally. Add Firebase config to sync remotely.";
          } catch (error) {
            console.error(error);
            saveStatus.textContent = "Save failed. Check Firebase configuration and permissions.";
          }
        });
      }

      function setDrawerOpen(isOpen) {
        drawer.classList.toggle("is-open", isOpen);
        drawerToggle.setAttribute("aria-expanded", String(isOpen));
      }

      function locateUser() {
        if (!navigator.geolocation) {
          locationStatus.textContent = "Geolocation is not available in this browser.";
          return;
        }

        locationStatus.textContent = "Waiting for location fix...";

        navigator.geolocation.watchPosition(
          ({ coords }) => {
            const latLng = [coords.latitude, coords.longitude];
            state.userLocation = latLng;

            if (!state.userMarker) {
              state.userMarker = L.circleMarker(latLng, {
                radius: 9,
                color: "#12413a",
                weight: 2,
                fillColor: "#f9fffd",
                fillOpacity: 0.95,
              }).addTo(state.map);

              state.map.setView(latLng, 16);
            } else {
              state.userMarker.setLatLng(latLng);
            }

            locationStatus.textContent = `GPS locked: ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;
          },
          (error) => {
            locationStatus.textContent = `Location unavailable: ${error.message}`;
          },
          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 15000,
          },
        );
      }

      function initFirebaseListener() {
        const configReady = Object.values(firebaseConfig).every(Boolean);

        if (!configReady) {
          locationStatus.textContent = `${locationStatus.textContent} Demo data loaded until Firebase is configured.`;
          applyObjects(demoGeoObjects);
          return;
        }

        const app = initializeApp(firebaseConfig);
        state.database = getDatabase(app);
        const objectRef = ref(state.database, firebaseCollectionPath);

        state.firebaseReady = true;

        onValue(objectRef, (snapshot) => {
          applyObjects(snapshot.val() || {});
        });
      }

      function applyObjects(nextObjects) {
        state.objects = normalizeObjects(nextObjects);
        renderLayer();
        renderObjectList();

        if (state.selectedId && !state.objects[state.selectedId]) {
          state.selectedId = null;
        }

        if (state.selectedId) {
          populateEditor(state.selectedId);
        } else {
          showEmptyEditor();
        }
      }

      function normalizeObjects(rawObjects) {
        if (Array.isArray(rawObjects)) {
          return rawObjects.reduce((accumulator, entry, index) => {
            if (!entry) {
              return accumulator;
            }

            const id = entry.properties?.id || `item-${index}`;
            accumulator[id] = {
              ...entry,
              properties: {
                ...entry.properties,
                id,
              },
            };
            return accumulator;
          }, {});
        }

        return Object.entries(rawObjects).reduce((accumulator, [key, entry]) => {
          if (!entry) {
            return accumulator;
          }

          accumulator[key] = {
            ...entry,
            properties: {
              ...entry.properties,
              id: entry.properties?.id || key,
            },
          };
          return accumulator;
        }, {});
      }

      function renderLayer() {
        if (state.geoJsonLayer) {
          state.geoJsonLayer.remove();
        }

        const visibleFeatures = Object.values(state.objects).filter((feature) => feature.properties?.visible);

        state.geoJsonLayer = L.geoJSON(visibleFeatures, {
          pointToLayer: (feature, latlng) => L.circleMarker(latlng, pointStyle(feature)),
          style: polygonStyle,
          onEachFeature: (feature, layer) => {
            layer.bindPopup(buildPopupMarkup(feature));
            layer.on("click", () => {
              const id = feature.properties?.id;
              if (id) {
                selectObject(id, { flyTo: false });
              }
            });
          },
        }).addTo(state.map);
      }

      function pointStyle(feature) {
        const color = feature.properties?.color || "#0b8f87";
        return {
          radius: 9,
          color,
          fillColor: color,
          fillOpacity: 0.85,
          weight: 2,
        };
      }

      function polygonStyle(feature) {
        const color = feature.properties?.color || "#0b8f87";
        return {
          color,
          fillColor: color,
          fillOpacity: 0.22,
          weight: 2,
        };
      }

      function buildPopupMarkup(feature) {
        const properties = feature.properties || {};
        const extraData = properties.extraData || {};
        const extraItems = Object.entries(extraData)
          .map(([key, value]) => `<li><strong>${escapeHtml(key)}:</strong> ${escapeHtml(String(value))}</li>`)
          .join("");

        return `
          <div>
            <strong>${escapeHtml(properties.name || properties.id || "Untitled object")}</strong>
            <p>${escapeHtml(properties.description || "No description available.")}</p>
            ${extraItems ? `<ul class="popup-details">${extraItems}</ul>` : ""}
          </div>
        `;
      }

      function renderObjectList() {
        const entries = Object.values(state.objects);

        objectList.innerHTML = entries.length
          ? entries
              .map((feature) => {
                const id = feature.properties?.id;
                const color = feature.properties?.color || "#0b8f87";
                const visible = feature.properties?.visible ? "Visible" : "Hidden";
                const selectedClass = state.selectedId === id ? "is-selected" : "";
                const name = escapeHtml(feature.properties?.name || id || "Unnamed object");
                const type = escapeHtml(feature.geometry?.type || "Unknown");

                return `
                  <li>
                    <button class="${selectedClass}" type="button" data-id="${escapeHtml(id)}">
                      <span>
                        <strong style="color: ${escapeHtml(color)};">${name}</strong>
                        <span class="list-meta">${type} • ${visible}</span>
                      </span>
                      <span aria-hidden="true">Edit</span>
                    </button>
                  </li>
                `;
              })
              .join("")
          : "<li>No GeoJSON objects found.</li>";
      }

      function selectObject(id, options = {}) {
        const feature = state.objects[id];
        if (!feature) {
          return;
        }

        state.selectedId = id;
        populateEditor(id);
        renderObjectList();
        setDrawerOpen(true);

        if (options.flyTo !== false) {
          focusFeature(feature);
        }
      }

      function focusFeature(feature) {
        const geometry = feature.geometry || {};

        if (geometry.type === "Point") {
          const [lng, lat] = geometry.coordinates;
          state.map.flyTo([lat, lng], 17, { duration: 0.6 });
          return;
        }

        const boundsLayer = L.geoJSON(feature);
        const bounds = boundsLayer.getBounds();

        if (bounds.isValid()) {
          state.map.flyToBounds(bounds, {
            padding: [24, 24],
            duration: 0.6,
          });
        }
      }

      function populateEditor(id) {
        const feature = state.objects[id];
        if (!feature) {
          showEmptyEditor();
          return;
        }

        editorForm.hidden = false;
        editorEmptyState.textContent = `Editing ${feature.properties?.name || id}`;
        fieldName.value = feature.properties?.name || "";
        fieldColor.value = feature.properties?.color || "#0b8f87";
        fieldVisible.checked = Boolean(feature.properties?.visible);
        fieldDescription.value = feature.properties?.description || "";
        fieldExtra.value = JSON.stringify(feature.properties?.extraData || {}, null, 2);
      }

      function showEmptyEditor() {
        editorForm.hidden = true;
        editorEmptyState.textContent = "Select an object from the list.";
        saveStatus.textContent = "";
      }

      async function persistObject(id, nextEntry) {
        if (state.firebaseReady && state.database) {
          await update(ref(state.database, firebaseCollectionPath), { [id]: nextEntry });
        }

        applyObjects({
          ...state.objects,
          [id]: nextEntry,
        });
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
    </script>
  </body>
</html>
