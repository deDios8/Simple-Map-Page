<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Simple Map Page</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map" aria-label="Interactive map"></div>

      <section class="status-card" aria-live="polite">
        <p class="status-label">Location</p>
        <p id="location-status">Requesting GPS access...</p>
      </section>

      <div class="request-actions" aria-label="Client requests">
        <button id="request-a-button" class="request-action-button" type="button" aria-label="Send request A">A</button>
        <button id="request-b-button" class="request-action-button" type="button" aria-label="Send request B">B</button>
        <button id="request-x-button" class="request-action-button" type="button" aria-label="Send request X">X</button>
        <button id="request-y-button" class="request-action-button" type="button" aria-label="Send request Y">Y</button>
      </div>

      <button
        id="drawer-toggle"
        class="drawer-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="drawer"
        aria-label="Open object list"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <aside id="drawer" class="drawer" aria-label="GeoJSON objects">
        <div class="drawer-header">
          <div>
            <p class="eyebrow">User Session</p>
            <h1 id="drawer-session-title">Session</h1>
          </div>
          <div class="drawer-header-actions">
            <button id="listener-toggle" class="listener-toggle" type="button" aria-label="Pause/Resume Firebase listener" title="Pause/Resume Firebase listener" data-state="active">pause db</button>
            <button id="drawer-close" class="text-button" type="button">Close</button>
          </div>
        </div>

        <div class="drawer-body">
          <section class="panel-section">
            <ul id="object-list" class="object-list"></ul>
          </section>

          <section class="panel-section">
            <div class="editor-header">
              <!-- <h2>Edit object</h2> -->
              <h2 id="editor-empty-state">Select an object to edit.</h2>
            </div>

            <form id="editor-form" class="editor-form" hidden>
              <div class="appearance-row">
                <label>
                  Title
                  <input id="field-name" name="name" type="text" placeholder="Object label" />
                </label>

                <label>
                  Type
                  <input id="field-type" name="type" type="text" placeholder="Object type" />
                </label>

                <label>
                  Color
                  <input id="field-color" name="color" type="color" value="#0b8f87" />
                </label>

                <label class="checkbox-row">
                  <input id="field-visible" name="visible" type="checkbox" />
                  Visible on map
                </label>
              </div>

              <div class="coordinates-row">
                <label>
                  Latitude
                  <textarea
                    id="field-latitude"
                    name="latitude"
                    rows="1"
                    placeholder='0.0'
                  ></textarea>
                </label>

                <label>
                  Longitude
                  <textarea
                    id="field-longitude"
                    name="longitude"
                    rows="1"
                    placeholder='-0.0'
                  ></textarea>
                </label>

                <label>
                  Radius
                  <textarea
                    id="field-radius"
                    name="radius"
                    rows="1"
                    placeholder='10'
                  ></textarea>
                </label>
              </div>

              <label>
                Description
                <textarea
                  id="field-description"
                  name="description"
                  rows="1"
                  placeholder="Extra details shown when tapped"
                ></textarea>
              </label>

              <section class="stats-section" aria-labelledby="stats-heading">
                <div class="stats-header">
                  <h3 id="stats-heading">Stats</h3>
                  <button id="add-stat-button" class="text-button" type="button">Add stat</button>
                </div>
                <div id="stats-list" class="stats-list"></div>
              </section>

              <section class="statuses-section" aria-labelledby="statuses-heading">
                <div class="statuses-header">
                  <h3 id="statuses-heading">Statuses</h3>
                  <button id="add-status-button" class="text-button" type="button">Add status</button>
                </div>
                <div id="statuses-list" class="statuses-list"></div>
              </section>

              <label>
                Additional data (JSON)
                <textarea
                  id="field-extra"
                  name="extra"
                  rows="5"
                  spellcheck="false"
                  placeholder='{"priority":"high"}'
                ></textarea>
              </label>

              <div class="editor-actions">
                <div class="editor-action-buttons">
                  <button class="primary-button" type="submit">Save changes</button>
                  <button id="delete-object-button" class="danger-button" type="button">Delete</button>
                </div>
                <p id="save-status" class="save-status" aria-live="polite"></p>
              </div>

              <div class="editor-bottom-spacer" aria-hidden="true"></div>
            </form>
          </section>
        </div>
      </aside>
    </main>

    <div id="user-id-modal" class="id-modal-overlay">
      <div class="id-modal-card">
        <p class="eyebrow">Welcome</p>
        <h2>Enter your ID</h2>
        <p>Your location will be tracked on the map under this identifier.</p>
        <form id="user-id-form">
          <input
            id="session-name-input"
            type="text"
            placeholder="Session name"
            value="testBed"
            autocomplete="off"
            required
          />
          <input
            id="user-id-input"
            type="text"
            placeholder="Your identifier"
            autocomplete="off"
            required
          />
          <input
            id="user-pass-input"
            type="password"
            placeholder="Password"
            autocomplete="off"
            required
          />
          <p id="user-id-status" aria-live="polite"></p>
          <button class="primary-button" type="submit">Start tracking</button>
        </form>
        <p id="version-info">Version: --</p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
